<svg class="receipt-emblem" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

    <circle class="receipt-clock-face" cx="12" cy="12" r="9"/>

  {% endif %}
</svg>
