{% if notification_in_app_enabled %}<a class="topbar-notifications position-relative" href="{% url 'core:notifications' %}" aria-label="Notifications" hx-get="{% url 'core:notification_count' %}" hx-trigger="every 60s [document.visibilityState=='visible']" hx-target="this" hx-swap="outerHTML">
  <svg class="notification-bell" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></svg>
  <span class="notification-count{% if not unread_notifications %} d-none{% endif %}" data-notification-count aria-live="polite" aria-atomic="true"{% if not unread_notifications %} aria-hidden="true"{% endif %}>{% if unread_notifications > 99 %}99+{% else %}{{ unread_notifications }}{% endif %}</span>
</a>{% endif %}
