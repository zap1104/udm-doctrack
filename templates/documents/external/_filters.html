<form method="get" class="card-udm mb-4" role="search" aria-label="Filter external documents" {% include "partials/_auto_filter_attrs.html" %}>
  <div class="card-udm-body">
    {% include "partials/_form_errors.html" %}
    <div class="row g-3">
      {% for field in form %}<div class="col-md-6 col-xl-4">{% include "partials/_field.html" with field=field %}</div>{% endfor %}
    </div>
    <div class="form-actions"><button class="btn btn-udm" type="submit">Search</button><a class="btn btn-udm-outline" href="{{ request.path }}" data-filter-reset>Clear filters</a></div>
  </div>
</form>
