# Render.com blueprint. Push this repo, then "New > Blueprint" and pick it.
services:
  - type: web
    name: udm-doctrack
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate --noinput && python manage.py init_db"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /accounts/login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: udm-doctrack-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: "local"
      - key: OCR_SPACE_API_KEY
        sync: false

databases:
  - name: udm-doctrack-db
    plan: free
    databaseName: udm_doctrack
    user: udm
