# Keep tooling separate from dependency discovery; deployments use requirements.txt.
line-length = 120
target-version = "py311"
exclude = ["migrations", ".venv", "staticfiles", ".claude"]

[lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "B008",   # Django uses callables in defaults all the time
]

[lint.isort]
known-first-party = ["apps", "config"]
